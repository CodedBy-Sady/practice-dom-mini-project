<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 100px;
        }
        .box{
            height: 30px;
            width: 30px;
            margin: 10px;
            padding: 10px;
            border: 2px solid;
            
        }

         .container2{

            display: flex;
            color: rgb(245, 245, 245);
            background-color: rgba(0, 0, 0, 0.669);
            height: 60px;
            border: 2px solid aqua;
            border-radius: 10px;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 100px;
            
        }

        .btn{

            font-weight: bold;
            color: rgb(245, 245, 245);
            background-color: rgba(0, 0, 0, 0.669);
            height: 30px;
            border: 2px solid aqua;
            border-radius: 10px;
            box-sizing: border-box;
            
        }
       
    </style>
</head>
<body>

    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
    </div>
<div class="container2">
    <button class="btn btn1">click </button>
    <button class="btn btn2">double click</button>
    <button class="btn btn3">Mouse down</button>
    <button class="btn btn4">Mouse up</button>
    <button class="btn btn5">mouse move</button>
    <button class="btn btn6">mouse out</button>
    <button class="btn btn7">right click</button>
    <button class="btn btn8">Mouse over</button>
</div>

    

    <script src="script.js"></script>
</body>
</html>
